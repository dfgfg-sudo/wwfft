    - 完全模式 (full): 端到端全链路，含智能触发与监控

    ## 设计原则
    - 单一入口驱动（仅需在结束点输入需求）
    - 全自动逆向推导（基于需求自动构建前置节点）
    - 零手动配置（中间过程完全透明）
    - 全节点自愈（自动检测并修复所有错误类型）

    ## 整合来源
    本规范合并了对话中所有版本（v1.0 ~ v10.1.0）的有效内容，修复了：
    - API URL前缀不一致 → 统一为 /v1
