          maxLength: 100
        description:
          type: string
          maxLength: 500
        version:
          type: string
        tags:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true

    WorkflowDefinition:
      type: object
      properties:
        version:
          type: string
          default: "1.0"
        triggers:
          type: array
          items:
