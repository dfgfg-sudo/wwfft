        - name
        - type
        - config
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        type:
          type: string
          enum:
            - "database"
            - "api"
            - "file"
            - "messaging"
        description:
          type: string
          maxLength: 500
        config:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string

    AIEnhancementRequest:
      type: object
      required:
        - input
