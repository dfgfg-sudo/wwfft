          maxLength: 500
        input_parameters:
          type: array
          items:
            $ref: "#/components/schemas/PluginParameter"
        output_parameters:
          type: array
          items:
            $ref: "#/components/schemas/PluginParameter"
        auto_register:
          type: boolean
          default: true

    PluginParameter:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - "string"
            - "number"
            - "boolean"
            - "object"
            - "array"
        required:
          type: boolean
          default: false
        description:
          type: string

    AIConfig:
      type: object
