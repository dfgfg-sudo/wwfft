        data:
          type: object
          properties:
            workflow_id:
              type: string
            repair_scope:
              type: string
            repair_details:
              type: array
              items:
                $ref: "#/components/schemas/RepairDetail"
            repair_statistics:
              type: object
              properties:
                total_nodes:
                  type: integer
                repaired_count:
                  type: integer
