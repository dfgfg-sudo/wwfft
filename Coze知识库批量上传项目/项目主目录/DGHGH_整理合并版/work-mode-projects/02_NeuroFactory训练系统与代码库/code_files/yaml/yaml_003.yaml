            - "cancelled"
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        initiatedBy:
          type: string
        results:
          type: object

    WorkflowConfig:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        version:
          type: string
          default: "1.0.0"
        tags:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTrigger"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowOutput"

