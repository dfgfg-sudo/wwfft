        model_preference:
          type: string
          enum:
            - "standard"
            - "advanced"
            - "custom"
          default: "standard"
        processing_options:
          type: object

    DataConnectionConfig:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - "database"
            - "api"
            - "file"
            - "messaging"
        config:
          type: object

    WorkflowResult:
      type: object
      properties:
        workflow_id:
