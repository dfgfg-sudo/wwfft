            - "condition"
            - "loop"
            - "delay"
        action:
          type: string
        parameters:
          type: object
        onSuccess:
          type: string
        onFailure:
          type: string

    WorkflowOutput:
      type: object
      properties:
        name:
          type: string
        valueFrom:
          type: string

    WorkflowExecuteRequest:
      type: object
      properties:
        parameters:
          type: object
        async:
          type: boolean
          default: false

    WorkflowExecutionResponse:
      type: object
