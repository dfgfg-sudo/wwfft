            - "invalid_config"
            - "logic_error"
            - "dependency_missing"
            - "param_error"
        error_detail:
          type: string
        repair_action:
          type: string
        repair_status:
          type: string
          enum:
            - "success"
            - "failed"

    AIResult:
      type: object
      properties:
        enhanced_data:
