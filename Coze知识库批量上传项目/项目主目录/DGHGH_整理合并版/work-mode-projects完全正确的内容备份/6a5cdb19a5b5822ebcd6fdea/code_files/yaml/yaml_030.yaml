# 并行执行任务
   parallel_tests:
     matrix:
       node-version: [14, 16, 18]
       os: [ubuntu-latest, windows-latest]
   
   # 缓存依赖加速构建
   - name: Cache node modules
     uses: actions/cache@v3
     with:
       path: node_modules
       key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}