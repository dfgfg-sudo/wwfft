        industry_type:
          type: string
          description: 行业类型
          enum:
            - manufacturing
            - retail
            - healthcare
            - finance
            - education
          example: retail
        user_request:
          type: string
          description: 用户请求
          example: "分析电商行业发展趋势"

    PluginConfig:
      type: object
      description: 插件配置
      properties:
        plugin_description:
          type: string
          description: 插件描述
          example: "订单处理插件"
        self_healing_enabled:
          type: boolean
          description: 是否启用自愈
          example: true

    QueryConfig:
      type: object
      description: 查询配置
      properties:
        page_number:
          type: integer
          description: 页码
          minimum: 1
          example: 1
        page_size:
          type: integer
          description: 每页大小
          minimum: 1
          maximum: 100
          example: 20

    RepairConfig:
      type: object
      description: 修复配置
      properties:
        diagnosis_level:
          type: string
          description: 诊断级别
          enum:
            - quick
            - standard
            - comprehensive
          example: standard
        repair_type:
          type: string
          description: 修复类型
          enum:
            - system
            - network
            - database
            - application
            - performance
          example: system

    TrainingConfig:
      type: object
      description: 训练配置
      properties:
        model_type:
          type: string
          description: 模型类型
          enum:
            - classification
            - regression
            - clustering
            - nlp
          example: classification
        training_data:
          type: string
          description: 训练数据
          example: "训练数据集URL或内容"

    ValidationConfig:
      type: object
      description: 验证配置
      properties:
        parameters_to_validate:
          type: object
          description: 要验证的参数
        strict_mode:
          type: boolean
          description: 严格模式
          example: true
        auto_validate:
          type: boolean
          description: 自动验证
          example: true
        validation_strictness:
          type: string
          description: 验证严格程度
          enum:
            - relaxed
            - standard
            - strict
          example: standard

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token认证
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API密钥认证
    CozeAPIKey:
      type: apiKey
      in: header
      name: X-Coze-API-Key
      description: Coze平台API密钥（从Coze控制台→API密钥管理获取）
    NoAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 无认证模式（用于测试）

security:
  - BearerAuth: []
  - ApiKeyAuth: []
  - CozeAPIKey: []