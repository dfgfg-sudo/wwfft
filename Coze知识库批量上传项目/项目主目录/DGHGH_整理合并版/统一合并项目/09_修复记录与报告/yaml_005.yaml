openapi: 3.0.0
info:
  title: 企业工作流智能编排系统 API
  description: "统一的企业级工作流管理、自动化执行和智能编排平台，集成30个核心功能模块"
  version: "1.0.0"
  contact:
    name: "技术支持团队"
    email: "support@enterprise-workflow.com"
    url: "https://enterprise-workflow.com"
  license:
    name: "商业许可"
    url: "https://enterprise-workflow.com/license"

servers:
  - url: "https://api.enterprise-workflow.com/v1"
    description: "生产环境"
  - url: "https://staging-api.enterprise-workflow.com/v1"
    description: "测试环境"
  - url: "https://dev-api.enterprise-workflow.com/v1"
    description: "开发环境"

paths:
  /execute:
    post:
      operationId: "universalExecute"
      summary: "统一执行端点"
      description: "通过统一的API端点执行所有30种功能操作"
      tags:
        - "Universal Operations"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniversalRequest"
            examples:
              emergency_example:
                summary: "紧急模式激活示例"
                value:
                  operation_type: "activate_emergency"
                  operation_config:
                    emergency_config:
                      emergency_level: "critical"
                      activation_reason: "系统检测到严重安全威胁"
                      auto_recovery: true
                      recovery_strategy: "immediate"
                      notification_contacts: ["admin@company.com", "ops@company.com"]
                  version: "v2.0"
                  async_execution: false
                  validation_config:
                    auto_validate: true
                    validation_strictness: "strict"
              workflow_example:
                summary: "工作流生成示例"
                value:
                  operation_type: "generate_workflow"
                  operation_config:
                    workflow_config:
                      requirement_description: "需要创建一个电商订单处理工作流，包含库存检查、支付验证和物流分配"
                      business_domain: "ecommerce"
                      complexity_level: "medium"
                      validation_strictness: "standard"
                  version: "v1.0"
                  async_execution: true
                  callback_url: "https://webhook.company.com/callback"
              ai_enhancement_example:
                summary: "AI数据增强示例"
                value:
                  operation_type: "ai_enhancement"
                  operation_config:
                    ai_enhancement_config:
                      input_data: "需要清洗和增强的用户行为数据..."
                      enhancement_type: "cleaning"
                      output_format: "json"
                  version: "v1.0"
                  async_execution: false
      responses:
        "200":
          description: "操作执行成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversalResponse"
              examples:
                success_sync:
                  summary: "同步执行成功"
                  value:
                    success: true
                    operation_id: "op_123456789"
                    result:
                      workflow_definition:
                        nodes:
                          - id: "node_1"
                            type: "input"
                            name: "订单接收"
                          - id: "node_2"
                            type: "process"
                            name: "库存检查"
                        connections:
                          - from: "node_1"
                            to: "node_2"
                      validation_results:
                        valid: true
                        warnings: []
                    execution_time: 2.45
                    timestamp: "2024-01-15T10:30:00Z"
                success_async:
                  summary: "异步执行已接受"
                  value:
                    success: true
                    operation_id: "op_987654321"
                    status: "accepted"
                    monitor_url: "https://api.enterprise-workflow.com/v1/operations/op_987654321"
                    estimated_completion: "2024-01-15T10:35:00Z"
                    timestamp: "2024-01-15T10:30:00Z"
        "202":
          description: "异步操作已接受"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncResponse"
        "400":
          description: "请求参数错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_enum:
                  summary: "枚举值无效"
                  value:
                    error_code: "INVALID_PARAM_ENUM"
                    error_message: "参数值不在允许的枚举范围内"
                    error_details:
                      field: "operation_config.emergency_config.emergency_level"
                      provided_value: "urgent"
                      allowed_values: ["low", "medium", "high", "critical", "level1", "level2", "level3", "level4"]
                    suggestion: "请使用允许的枚举值：low, medium, high, critical, level1, level2, level3, level4"
                    timestamp: "2024-01-15T10:30:00Z"
                missing_required:
                  summary: "缺少必需参数"
                  value:
                    error_code: "MISSING_REQUIRED_PARAM"
                    error_message: "缺少必需的参数"
                    error_details:
                      missing_fields: ["workflow_id", "confirmation"]
                    suggestion: "请提供所有必需的参数"
                    timestamp: "2024-01-15T10:31:00Z"
        "401":
          description: "未授权访问"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error_code: "UNAUTHORIZED"
                error_message: "访问令牌无效或已过期"
                suggestion: "请检查Bearer Token是否正确"
                timestamp: "2024-01-15T10:30:00Z"
        "500":
          description: "服务器内部错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error_code: "INTERNAL_ERROR"
                error_message: "服务器处理请求时发生内部错误"
                suggestion: "请稍后重试或联系技术支持"
                timestamp: "2024-01-15T10:30:00Z"

  /operations/{operation_id}:
    get:
      operationId: "getOperationStatus"
      summary: "获取操作状态"
      description: "查询异步操作的执行状态和结果"
      tags:
        - "Operation Monitoring"
      security:
        - bearerAuth: []
      parameters:
        - name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
          description: "操作ID"
      responses:
        "200":
          description: "操作状态信息"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationStatus"
              example:
                operation_id: "op_123456789"
                status: "processing"
                progress: 65
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-01-15T10:31:00Z"
                estimated_remaining: 120
        "404":
          description: "操作未找到"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "服务器内部错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /validate:
    post:
      operationId: "validateOperationParameters"
      summary: "预验证操作参数"
      description: "在执行操作前验证参数的合法性"
      tags:
        - "Validation"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniversalRequest"
      responses:
        "200":
          description: "验证结果"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  is_valid:
                    type: "boolean"
                  validation_errors:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        field:
                          type: "string"
                        error:
                          type: "string"
                        suggestion:
                          type: "string"
                  suggestions:
                    type: "array"
                    items:
                      type: "string"
              example:
                is_valid: false
                validation_errors:
                  - field: "operation_config.emergency_config.emergency_level"
                    error: "值 'urgent' 不在允许的枚举值中"
                    suggestion: "请使用: low, medium, high, critical"
                suggestions:
                  - "emergency_level 应该为 low, medium, high, critical 之一"

  /health:
    get:
      operationId: "healthCheck"
      summary: "健康检查"
      description: "检查服务健康状态和各模块可用性"
      tags:
        - "System"
      responses:
        "200":
          description: "服务健康"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    enum: ["healthy", "degraded", "unhealthy"]
                  timestamp:
                    type: "string"
                    format: "date-time"
                  components:
                    type: "object"
                    properties:
                      workflow_engine:
                        type: "string"
                        enum: ["up", "down", "degraded"]
                      ai_services:
                        type: "string"
                        enum: ["up", "down", "degraded"]
                      system_ops:
                        type: "string"
                        enum: ["up", "down", "degraded"]
                      cultural_services:
                        type: "string"
                        enum: ["up", "down", "degraded"]
                      database:
                        type: "string"
                        enum: ["connected", "disconnected"]
                      cache:
                        type: "string"
                        enum: ["connected", "disconnected"]
                  version:
                    type: "string"
                  uptime:
                    type: "number"
              example:
                status: "healthy"
                timestamp: "2024-01-15T10:30:00Z"
                components:
                  workflow_engine: "up"
                  ai_services: "up"
                  system_ops: "up"
                  cultural_services: "up"
                  database: "connected"
                  cache: "connected"
                version: "1.0.0"
                uptime: 86400

components:
  schemas:
    UniversalRequest:
      type: "object"
      required:
        - "operation_type"
        - "operation_config"
      properties:
        operation_type:
          type: "string"
          enum:
            - "activate_emergency"
            - "ai_enhancement"
            - "analyze_industry"
            - "auto_repair"
            - "backup_revert"
            - "create_custom_node"
            - "create_workflow"
            - "delete_workflow"
            - "execute_workflow"
            - "feed_data"
            - "generate_workflow"
            - "get_data_connections"
            - "get_workflow_by_id"
            - "get_workflows"
            - "process_automation"
            - "process_luoyang_heritage"
            - "repair_all_nodes"
            - "train_model"
            - "trigger_auto_plugin_workflow"
            - "update_workflow"
            - "validate_parameters"
          description: "要执行的操作类型"
        operation_config:
          type: "object"
          description: "操作配置参数"
          properties:
            emergency_config:
              $ref: "#/components/schemas/EmergencyConfig"
            ai_enhancement_config:
              $ref: "#/components/schemas/AIEnhancementConfig"
            workflow_config:
              $ref: "#/components/schemas/WorkflowConfig"
            repair_config:
              $ref: "#/components/schemas/RepairConfig"
            backup_config:
              $ref: "#/components/schemas/BackupConfig"
            custom_node_config:
              $ref: "#/components/schemas/CustomNodeConfig"
            industry_config:
              $ref: "#/components/schemas/IndustryConfig"
            training_config:
              $ref: "#/components/schemas/TrainingConfig"
            heritage_config:
              $ref: "#/components/schemas/HeritageConfig"
            automation_config:
              $ref: "#/components/schemas/AutomationConfig"
            validation_config:
              $ref: "#/components/schemas/ValidationConfig"
            plugin_config:
              $ref: "#/components/schemas/PluginConfig"
            connection_config:
              $ref: "#/components/schemas/ConnectionConfig"
            query_config:
              $ref: "#/components/schemas/QueryConfig"
        version:
          type: "string"
          enum: ["v1.0", "v2.0", "v3.0"]
          default: "v1.0"
          description: "功能版本号"
        async_execution:
          type: "boolean"
          default: false
          description: "是否异步执行"
        callback_url:
          type: "string"
          format: "uri"
          description: "异步回调URL"
        validation_config:
          type: "object"
          description: "验证配置"
          properties:
            auto_validate:
              type: "boolean"
              description: "是否自动验证参数"
            validation_strictness:
              type: "string"
              enum: ["relaxed", "standard", "strict"]
              description: "验证严格程度"
            error_handling:
              type: "string"
              enum: ["strict", "lenient", "adaptive"]
              description: "错误处理策略"

    UniversalResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          description: "操作是否成功"
        operation_id:
          type: "string"
          description: "操作唯一标识符"
        status:
          type: "string"
          enum: ["completed", "processing", "failed", "accepted"]
          description: "操作状态"
        result:
          type: "object"
          description: "操作结果数据"
        error:
          type: "object"
          description: "错误信息"
          properties:
            code:
              type: "string"
            message:
              type: "string"
            details:
              type: "object"
        execution_time:
          type: "number"
          description: "执行时间（秒）"
        timestamp:
          type: "string"
          format: "date-time"
          description: "响应时间戳"
        monitor_url:
          type: "string"
          format: "uri"
          description: "监控URL（异步操作）"

    AsyncResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          description: "操作是否成功"
        operation_id:
          type: "string"
          description: "操作唯一标识符"
        status:
          type: "string"
          enum: ["accepted"]
          description: "操作状态"
        monitor_url:
          type: "string"
          format: "uri"
          description: "监控URL"
        estimated_completion:
          type: "string"
          format: "date-time"
          description: "预计完成时间"

    OperationStatus:
      type: "object"
      properties:
        operation_id:
          type: "string"
        status:
          type: "string"
          enum: ["pending", "processing", "completed", "failed", "cancelled"]
        progress:
          type: "number"
          minimum: 0
          maximum: 100
          description: "执行进度百分比"
        result:
          type: "object"
          description: "操作结果（完成后可用）"
        error:
          type: "object"
          description: "错误信息（失败时可用）"
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
        estimated_remaining:
          type: "number"
          description: "预计剩余时间（秒）"

    ErrorResponse:
      type: "object"
      required:
        - "error_code"
        - "message"
      properties:
        error_code:
          type: "string"
          enum:
            - "INVALID_PARAMS"
            - "UNAUTHORIZED"
            - "OPERATION_NOT_FOUND"
            - "SERVICE_UNAVAILABLE"
            - "RATE_LIMITED"
            - "INTERNAL_ERROR"
        message:
          type: "string"
        details:
          type: "object"
        timestamp:
          type: "string"
          format: "date-time"
        request_id:
          type: "string"

    EmergencyConfig:
      type: "object"
      properties:
        emergency_level:
          type: "string"
          enum: ["low", "medium", "high", "critical", "level1", "level2", "level3", "level4"]
        activation_reason:
          type: "string"
        auto_recovery:
          type: "boolean"
        recovery_strategy:
          type: "string"
          enum: ["immediate", "gradual", "manual"]
        notification_contacts:
          type: "array"
          items:
            type: "string"
            format: "email"

    AIEnhancementConfig:
      type: "object"
      properties:
        input_data:
          type: "string"
        enhancement_type:
          type: "string"
          enum: ["cleaning", "enrichment", "completion", "quality_improvement"]
        output_format:
          type: "string"
          enum: ["json", "xml", "csv", "text"]
        batch_data:
          type: "array"
          items:
            type: "object"
        options:
          type: "object"

    WorkflowConfig:
      type: "object"
      properties:
        workflow_id:
          type: "string"
        workflow_name:
          type: "string"
        description:
          type: "string"
        nodes:
          type: "array"
          items:
            type: "object"
        triggers:
          type: "array"
          items:
            type: "object"
        requirement_description:
          type: "string"
        business_domain:
          type: "string"
          enum: ["ecommerce", "industry", "programming", "finance", "healthcare", "manufacturing", "retail", "education"]
        execution_parameters:
          type: "object"
        update_operations:
          type: "array"
          items:
            type: "object"
        complexity_level:
          type: "string"
          enum: ["simple", "medium", "complex"]
        validation_strictness:
          type: "string"
          enum: ["relaxed", "standard", "strict"]
        monitoring_level:
          type: "string"
          enum: ["basic", "detailed", "verbose"]
        result_format:
          type: "string"
          enum: ["summary", "detailed", "raw"]
        version_comment:
          type: "string"
        tags:
          type: "array"
          items:
            type: "string"

    RepairConfig:
      type: "object"
      properties:
        repair_type:
          type: "string"
          enum: ["system", "network", "database", "application", "performance"]
        diagnosis_level:
          type: "string"
          enum: ["quick", "standard", "comprehensive", "deep", "predictive"]
        diagnosis_mode:
          type: "string"
          enum: ["quick", "deep", "predictive"]
        auto_execute:
          type: "boolean"
        repair_strategy:
          type: "string"
          enum: ["auto", "semi_auto", "manual_approval"]
        backup_before_repair:
          type: "boolean"
        repair_scope:
          type: "string"
          enum: ["configuration", "logic", "dependencies", "all"]
        target_components:
          type: "array"
          items:
            type: "string"

    BackupConfig:
      type: "object"
      properties:
        backup_id:
          type: "string"
        revert_scope:
          type: "string"
          enum: ["full", "partial", "data_only"]
        revert_type:
          type: "string"
          enum: ["full", "incremental", "selective"]
        confirmation_required:
          type: "boolean"
        target_components:
          type: "array"
          items:
            type: "string"
        preview_changes:
          type: "boolean"
        rollback_plan:
          type: "string"
        conflict_resolution:
          type: "string"
          enum: ["overwrite", "merge", "skip"]

    CustomNodeConfig:
      type: "object"
      properties:
        node_type:
          type: "string"
          enum: ["code", "plugin", "metadata"]
        programming_language:
          type: "string"
          enum: ["python", "javascript", "typescript"]
        node_name:
          type: "string"
        code_content:
          type: "string"
        dependencies:
          type: "array"
          items:
            type: "string"
        configuration:
          type: "object"
        description:
          type: "string"

    IndustryConfig:
      type: "object"
      properties:
        industry_name:
          type: "string"
        analysis_depth:
          type: "string"
          enum: ["basic", "standard", "comprehensive"]
        analysis_type:
          type: "string"
          enum: ["classification", "trends", "competitive", "risk"]
        industry_type:
          type: "string"
          enum: ["manufacturing", "retail", "healthcare", "finance", "education"]
        time_period:
          type: "string"
        include_trends:
          type: "boolean"
        include_forecast:
          type: "boolean"
        region:
          type: "string"
        data_sources:
          type: "array"
          items:
            type: "string"
        geographic_scope:
          type: "string"
        forecast_period:
          type: "string"
        comparison_metrics:
          type: "array"
          items:
            type: "string"

    TrainingConfig:
      type: "object"
      properties:
        training_data:
          type: "string"
        training_dataset:
          type: "string"
        model_type:
          type: "string"
          enum: ["classification", "regression", "clustering", "nlp"]
        model_target:
          type: "string"
        data_format:
          type: "string"
          enum: ["json", "csv", "text", "image"]
        validation_split:
          type: "number"
          minimum: 0
          maximum: 1
        training_parameters:
          type: "object"
        preprocessing:
          type: "object"
        data_quality_check:
          type: "boolean"
        hyperparameter_tuning:
          type: "boolean"

    HeritageConfig:
      type: "object"
      properties:
        heritage_type:
          type: "string"
          enum: ["intangible", "tangible", "cultural_practice"]
        heritage_category:
          type: "string"
          enum: ["traditional_craft", "performing_arts", "rituals", "oral_traditions"]
        action_type:
          type: "string"
          enum: ["query", "register", "update", "preserve"]
        processing_mode:
          type: "string"
          enum: ["cataloging", "digital_preservation", "public_display", "research"]
        heritage_data:
          type: "object"
        cultural_context:
          type: "object"
        preservation_level:
          type: "string"
          enum: ["basic", "standard", "premium"]
        location:
          type: "string"
        digital_assets:
          type: "array"
          items:
            type: "string"

    AutomationConfig:
      type: "object"
      properties:
        operation_mode:
          type: "string"
          enum: ["industry_analysis", "workflow_generation", "auto_repair", "luoyang_heritage", "custom"]
        input_data:
          type: "object"
        input_parameters:
          type: "object"
        processing_level:
          type: "string"
          enum: ["basic", "advanced", "comprehensive"]
        optimization_level:
          type: "string"
          enum: ["standard", "optimized", "max_performance"]
        error_handling:
          type: "string"
          enum: ["strict", "lenient", "adaptive"]
        output_format:
          type: "string"
        parallel_processing:
          type: "boolean"

    ValidationConfig:
      type: "object"
      properties:
        parameters_to_validate:
          type: "object"
        validation_rules:
          type: "object"
        strict_mode:
          type: "boolean"
        context:
          type: "object"

    PluginConfig:
      type: "object"
      properties:
        plugin_description:
          type: "string"
        trigger_conditions:
          type: "object"
        self_healing_enabled:
          type: "boolean"
        execution_priority:
          type: "string"
          enum: ["low", "normal", "high", "critical"]
        node_types:
          type: "array"
          items:
            type: "string"

    ConnectionConfig:
      type: "object"
      properties:
        connection_type:
          type: "string"
          enum: ["all", "database", "api", "file", "streaming"]
        status_filter:
          type: "string"
          enum: ["all", "active", "inactive", "error"]
        include_details:
          type: "boolean"

    QueryConfig:
      type: "object"
      properties:
        page_number:
          type: "integer"
          minimum: 1
        page_size:
          type: "integer"
          minimum: 1
          maximum: 100
        filter_by_status:
          type: "string"
          enum: ["all", "active", "inactive", "draft"]
        sort_by:
          type: "string"
          enum: ["name", "created_date", "modified_date"]
        include_execution_history:
          type: "boolean"
        include_node_details:
