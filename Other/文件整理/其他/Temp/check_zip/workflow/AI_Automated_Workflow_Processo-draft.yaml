    code: "import json\nimport re\n\n# Coze工作流节点要求的异步主函数，内联所有逻辑避免函数未定义错误\nasync def\
      \ main(inputs):\n    \"\"\"异步主函数入口，处理输入参数并返回结果\n    \n    Args:\n        inputs\
      \ (dict): 包含输入参数的字典\n        \n    Returns:\n        dict: 处理结果\n    \"\"\"\n\
      \    # 1. 获取输入URL，清理格式\n    input_url = inputs.get('input_url', '').strip().strip('\"\
      `')\n    \n    # 2. 直接在函数内提取workflow_id和space_id，避免函数调用\n    workflow_id = \"\
      demo-workflow-id\"\n    space_id = \"demo-space-id\"\n    \n    # 提取workflow_id\n\
      \    workflow_match = re.search(r'workflow_id=([^&]+)', input_url)\n    if workflow_match:\n\
      \        workflow_id = workflow_match.group(1)\n    \n    # 提取space_id\n   \
      \ space_match = re.search(r'space_id=([^&]+)', input_url)\n    if space_match:\n\
      \        space_id = space_match.group(1)\n    \n    # 3. 构造并返回结果\n    return\
      \ {\n        \"content\": json.dumps({\n            \"name\": \"安全模拟工作流\",\n\
      \            \"workflow_id\": workflow_id,\n            \"space_id\": space_id,\n\
      \            \"nodes\": [\n                {\n                    \"id\": \"\
      start\",\n                    \"type\": \"start\",\n                    \"name\"\
      : \"开始节点\",\n                    \"inputs\": [],\n                    \"outputs\"\
      : []\n                },\n                {\n                    \"id\": \"\
      end\",\n                    \"type\": \"end\",\n                    \"name\"\
      : \"结束节点\",\n                    \"inputs\": [],\n                    \"outputs\"\
      : []\n                }\n            ],\n            \"edges\": [\n        \
      \        {\n                    \"from\": \"start\",\n                    \"\
      to\": \"end\"\n                }\n            ]\n        }, indent=2, ensure_ascii=False),\n\
      \        \"content_type\": [\"application/json\"]\n    }"
