          请分析以下视觉内容并生成相关自动化工作流：

          视觉输入：{{视觉理解输入}}

          技能类型：{{item1}}

          详细需求：{{用户提示词}}


          ## 代码生成请求

          请生成一个{{项目类型}}应用的完整代码，使用{{技术栈}}技术栈，实现以下功能：

