          技术栈：{{技术栈}}


          ## 工作流诊断请求

          请诊断以下工作流错误并提供修复方案：

          {{用户提示词}}

          技能要求：{{item1}}


          ## 格式说明

          - 使用双大括号`{{变量名}}`引用输入参数

          - 支持嵌套引用：`{{变量名.子变量名}}`

          - 支持数组索引：`{{变量名[0]}}`

          - 可同时引用多个变量


          ## 示例

          请基于{{item1}}技能，为我创建一个Web应用，使用Python+FastAPI技术栈，实现用户注册和登录功能。

          视觉参考：{{视觉理解输入}}

          详细需求：{{用户提示词}}'
      name: prompt
    - input:
