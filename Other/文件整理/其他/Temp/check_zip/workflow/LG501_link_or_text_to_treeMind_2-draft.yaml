  description: 编写代码，处理输入变量来生成返回值
  icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code.png
  id: '173824'
  name: 节点_10
  parameters:
    code: "\n\"\"\"\n作者: 俗人六哥\n抖音账号: @【俗人六哥】Ai企业获客盈利系统\n日期: 2024-06-04\n\n这个函数从输入文本中提取两个链接地址。具体功能如下：\n\
      - 提取图片型链接地址（包含在 `![返回图片](...)` 中）。\n- 提取编辑型链接地址（包含在 `[编辑](...)` 中）。\n\n参数:\n\
      - args: 包含输入参数的字典，键 \"input\" 对应客户输入的内容。\n\n返回:\n- 一个包含两个链接地址的字典，键 \"image_url\"\
      \ 对应图片型链接地址，键 \"edit_url\" 对应编辑型链接地址。\n\"\"\"\nfrom typing import TypedDict,\
      \ Dict\n\n# 定义输入参数类型\nclass Input(TypedDict):\n    input: str\n\n# 定义输出参数类型\n\
      class Output(TypedDict):\n    image_url: str\n    edit_url: str\n\nasync def\
      \ main(args) -> Output:\n    params = args.params\n    text = params['input']\n\
      \    \n    # 提取图片型链接地址\n    image_url_start = text.find(\"![返回图片](\") + len(\"\
      ![返回图片](\")\n    image_url_end = text.find(\")\", image_url_start)\n    image_url\
      \ = text[image_url_start:image_url_end]\n    \n    # 提取编辑型链接地址\n    edit_url_start\
      \ = text.find(\"[编辑](\") + len(\"[编辑](\")\n    edit_url_end = text.find(\")\"\
      , edit_url_start)\n    edit_url = text[edit_url_start:edit_url_end]\n    \n\
      \    return {\n        'image_url': image_url,\n        'edit_url': edit_url\n\
      \    }"
    functionID: 37ewtfzoimwvr
    language: 3
