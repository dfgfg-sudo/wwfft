- config: {}
  description: 编写代码，处理输入变量来生成返回值
  icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
  id: '1348425'
  name: 节点_10
  parameters:
    code: "import json\nfrom typing import List, Dict, Any\n\nasync def main(args:\
      \ Dict[str, Any]) -> Dict[str, Any]:\n    try:\n        # 获取输入参数\n        params\
      \ = args['params']\n        \n        # 检查必需的输入参数\n        if 'input' not in\
      \ params:\n            return {\"$error\": \"Missing required parameter: 'input'\
      \ (segment IDs list)\"}\n        \n        segment_ids = params['input']\n \
      \       \n        # 验证segment_ids是否为列表类型\n        if not isinstance(segment_ids,\
      \ list):\n            try:\n                # 尝试将字符串解析为列表\n                segment_ids\
      \ = json.loads(segment_ids)\n            except (json.JSONDecodeError, TypeError):\n\
      \                return {\"$error\": f\"Invalid 'input' format: expected list,\
      \ got {type(segment_ids).__name__}\"}\n        \n        # 验证segment_ids列表不为空\n\
      \        if not segment_ids:\n            return {\"$error\": \"Empty segment\
      \ IDs list\"}\n        \n        # 初始化关键帧列表\n        keyframes: List[Dict[str,\
      \ Any]] = []\n        \n        # 为每个segment生成关键帧（使用固定时长3秒，可根据需求调整）\n      \
      \  for seg_id in segment_ids:\n            # 确保segment_id是字符串类型\n          \
      \  seg_id_str = str(seg_id)\n            \n            # 设置动画时长（单位：毫秒）\n   \
      \         duration = 3000  # 默认3秒，可根据需求调整\n            \n            # 1. 缩放动画（轻微放大，增强聚焦感）\n\
      \            keyframes.append({\n                \"offset\": 0,\n          \
      \      \"property\": \"UNIFORM_SCALE\",\n                \"segment_id\": seg_id_str,\n\
      \                \"value\": 1.0,\n                \"easing\": \"ease_in_out\"\
      \n            })\n            keyframes.append({\n                \"offset\"\
      : duration,\n                \"property\": \"UNIFORM_SCALE\",\n            \
      \    \"segment_id\": seg_id_str,\n                \"value\": 1.1,\n        \
      \        \"easing\": \"ease_in_out\"\n            })\n            \n       \
      \     # 2. 透明度动画（淡入淡出）\n            keyframes.append({\n                \"offset\"\
      : 0,\n                \"property\": \"OPACITY\",\n                \"segment_id\"\
      : seg_id_str,\n                \"value\": 0.0,\n                \"easing\":\
      \ \"linear\"\n            })\n            keyframes.append({\n             \
      \   \"offset\": duration * 0.1,  # 10%时长时完全显示\n                \"property\"\
      : \"OPACITY\",\n                \"segment_id\": seg_id_str,\n              \
      \  \"value\": 1.0,\n                \"easing\": \"linear\"\n            })\n\
      \            keyframes.append({\n                \"offset\": duration * 0.9,\
      \  # 90%时长时开始淡出\n                \"property\": \"OPACITY\",\n              \
      \  \"segment_id\": seg_id_str,\n                \"value\": 1.0,\n          \
      \      \"easing\": \"linear\"\n            })\n            keyframes.append({\n\
      \                \"offset\": duration,\n                \"property\": \"OPACITY\"\
      ,\n                \"segment_id\": seg_id_str,\n                \"value\": 0.0,\
      \  # 结束时完全透明\n                \"easing\": \"linear\"\n            })\n     \
      \   \n        # 生成并验证JSON字符串\n        keyframes_json = json.dumps(keyframes)\n\
      \        \n        # 返回关键帧数据（确保输出变量名为\"keyframes\"）\n        return {\n    \
      \        \"keyframes\": keyframes_json\n        }\n    \n    except Exception\
      \ as e:\n        # 捕获所有异常并返回详细错误信息\n        return {\n            \"$error\"\
      : f\"Failed to generate keyframes: {str(e)}\",\n            \"details\": {\n\
      \                \"error_type\": type(e).__name__,\n                \"input_params\"\
      : str(params)[:500]  # 截取部分输入参数用于调试\n            }\n        }"
    language: 3
