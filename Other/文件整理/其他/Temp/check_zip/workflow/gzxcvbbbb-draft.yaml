  parameters:
    code: "import re,time\n\nasync def main(args: Args) -> Output:\n    # 获取需要拆解的文案​\n\
      \    texts = args.params.get(\"input\")\n    # 使用正则表达式按照 \\n 拆分段落​\n    pattern=r\"\
      \\n|$\"    \n    texts = re.split(pattern, texts)\n    # 清洗除了最后一段内容（重复）的文案，并按照\\\
      n 拼接​\n    texts = [t for t in texts if t.strip()!= \"\"] # 去除空行​\n   \n   \
      \ \n    title = args.params.get(\"title\")\n    # if title == None or title\
      \ == '':\n    #     title = f'标题为空{int(time.time())}'\n\n    if (title == None\
      \ or title == '') and '**标题：**' in texts[0]:\n        title = texts.pop(0)\n\
      \        title = title.replace('**标题：**','')\n\n    texts = \"\\n\".join(texts[:-1])\
      \ # 去除最后一段\n\n    ret: Output = {\n        \"output\": texts,\n        \"title\"\
      :title\n    }\n    return ret"
    language: 3
    node_inputs:
    - input:
        value:
          path: data.content
          ref_node: '180582'
      name: input
    - input:
