  parameters:
    code: "import re\nasync def main(args: Args) -> Output:\n    # 提取需要拆分的文本段落\n \
      \   text = args.params['input']\n    # 使用正则表达式拆分文本\n    pattern = r\"\\n|$\"\
      \n    texts = re.split(pattern, text)\n    # 去除空白段落\n    texts = [t for t in\
      \ texts if t.strip()!= \"\"]\n    # 构建输出字典\n    ret = {\n        \"output\"\
      : \"\\n\".join(texts[:-1]),\n        \"output2\": texts[-1],\n    }\n    return\
      \ ret"
    language: 3
    node_inputs:
    - input:
        value:
          path: output
          ref_node: '148923'
      name: input
    node_outputs:
      output:
        type: string
        value: null
      output2:
        type: string
        value: null
    settingOnError:
      switch: false
