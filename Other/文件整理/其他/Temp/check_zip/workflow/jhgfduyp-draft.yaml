          编排完成后试运行调试，成功则发布。

          五、注意事项

          不同工作流工具在操作和界面上可能存在差异，关键是要明确节点的输入输出及变量传递引用，再根据实际需求进行相应设置。

          清晰明确的工作流名称和描述，有助于大语言模型更好的理解工作流的功能。

          例如，对于将用户输入文本转换为大写并输出的简单工作流，按照上述 Coze 工作流步骤，在配置环节重点设置好处理文本转换的节点参数，即可实现相应功能。'
