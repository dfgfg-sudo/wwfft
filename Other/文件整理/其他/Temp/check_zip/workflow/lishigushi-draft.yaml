      name: duration_list
    - input:
        items:
          properties:
            end:
              type: integer
              value: null
            id:
              type: string
              value: null
            start:
              type: integer
              value: null
          type: object
          value: null
        type: list
        value:
          path: segment_infos
          ref_node: '1087428'
      name: segment_infos
    node_outputs:
      keyFrames:
        type: string
        value: null
    settingOnError:
      processType: 1
      retryTimes: 0
      switch: false
      timeoutMs: 60000
