    - input:
        type: string
        value: "/**\n * 增强版 COZE 工作流自动生成器\n * 支持复杂需求解析、参数配置增强和错误处理\n */\nasync function\
          \ main({ params }) {\n  try {\n    // 1. 获取并验证内容框输入\n    const contentBoxInput\
          \ = params.content || '';\n    if (!contentBoxInput.trim()) {\n      throw\
          \ new Error('内容框不能为空，请填写工作流需求描述');\n    }\n\n    // 2. 解析内容框输入\n    const\
          \ parsedData = parseContent(contentBoxInput);\n    \n    // 3. 生成工作流元素\n\
          \    const nodes = generateNodes(parsedData);\n    const connections = generateConnections(parsedData,\
          \ nodes);\n    \n    // 4. 验证生成结果\n    validateWorkflow(nodes, connections);\n\
          \n    // 5. 返回完整工作流配置\n    return {\n      workflowName: parsedData.name\
          \ || \"自动生成工作流_\" + new Date().toISOString().slice(0, 10),\n      inputSource:\
          \ contentBoxInput,\n      nodes,\n      connections\n    };\n  } catch (error)\
          \ {\n    // 错误处理\n    return {\n      error: error.message,\n      nodes:\
          \ [],\n      connections: []\n    };\n  }\n}\n\n/**\n * 解析内容框输入，提取工作流结构信息\n\
          \ */\nfunction parseContent(content) {\n  // 提取工作流名称\n  const nameMatch\
          \ = content.match(/生成\\s*([^，。\\n]+)\\s*流程/);\n  const name = nameMatch?.[1]?.trim()\
          \ || \"未命名工作流\";\n\n  // 提取步骤定义（支持序号、节点类型和参数说明）\n  const stepPattern = /(?:\\\
          d+\\.\\s*)?([^：]+)：\\s*([^（]+)(?:\\(([^)]+)\\))?/g;\n  const steps = [];\n\
          \  let match;\n  \n  while ((match = stepPattern.exec(content)) !== null)\
          \ {\n    const [, description, type, params] = match;\n    steps.push({\n\
          \      description: description.trim(),\n      type: normalizeNodeType(type.trim()),\n\
          \      params: parseNodeParams(params)\n    });\n  }\n\n  // 提取条件分支\n  const\
          \ conditions = [];\n  const conditionPattern = /条件\\s*[:：]\\s*([^；]+)；?/g;\n\
          \  \n  while ((match = conditionPattern.exec(content)) !== null) {\n   \
          \ const conditionText = match[1];\n    const [condition, action] = conditionText.split(/则|→/).map(part\
          \ => part.trim());\n    if (condition && action) {\n      conditions.push({\
          \ condition, action });\n    }\n  }\n\n  return { name, steps, conditions\
          \ };\n}\n\n/**\n * 规范化节点类型\n */\nfunction normalizeNodeType(type) {\n  const\
          \ typeMap = {\n    \"大模型\": \"大模型节点\",\n    \"AI\": \"大模型节点\",\n    \"插件\"\
          : \"插件节点\",\n    \"代码\": \"代码节点\",\n    \"条件分支\": \"条件节点\",\n    \"开始\"\
          : \"开始节点\",\n    \"结束\": \"结束节点\"\n  };\n  \n  return typeMap[type] || type;\n\
          }\n\n/**\n * 解析节点参数\n */\nfunction parseNodeParams(paramsText) {\n  if (!paramsText)\
          \ return {};\n  \n  const params = {};\n  const paramPairs = paramsText.split(/[,，]\\\
          s*/);\n  \n  paramPairs.forEach(pair => {\n    const [key, value] = pair.split(/[:：]\\\
          s*/).map(part => part.trim());\n    if (key) {\n      params[key] = value\
          \ || true;\n    }\n  });\n  \n  return params;\n}\n\n/**\n * 生成工作流节点\n */\n\
          function generateNodes(data) {\n  // 自动添加开始节点\n  const nodes = [{\n    id:\
          \ \"start_node\",\n    type: \"开始节点\",\n    description: \"流程开始\",\n   \
          \ parameters: {}\n  }];\n\n  // 生成用户定义的节点\n  data.steps.forEach((step, index)\
          \ => {\n    const nodeId = `node_${index + 1}`;\n    let parameters = {\
          \ ...step.params };\n\n    // 设置节点默认参数\n    switch (step.type) {\n     \
          \ case \"大模型节点\":\n        parameters.prompt = parameters.prompt || \n \
          \         `处理步骤：${step.description}，请根据业务规则返回处理结果`;\n        parameters.model\
          \ = parameters.model || \"gpt-3.5-turbo\";\n        break;\n      case \"\
          插件节点\":\n        parameters.pluginName = parameters.pluginName || \n   \
          \       step.description.includes(\"表单\") ? \"FormSubmit\" : \"DataProcess\"\
          ;\n        break;\n      case \"条件节点\":\n        parameters.condition =\
          \ parameters.condition || \"条件判断\";\n        break;\n      case \"代码节点\"\
          :\n        parameters.code = parameters.code || \n          `// 实现 ${step.description}\\\
          nconsole.log(\"执行 ${step.description}\");\\nreturn true;`;\n        break;\n\
          \    }\n\n    nodes.push({\n      id: nodeId,\n      type: step.type,\n\
          \      description: step.description,\n      parameters\n    });\n  });\n\
          \n  // 自动添加结束节点\n  nodes.push({\n    id: \"end_node\",\n    type: \"结束节点\"\
          ,\n    description: \"流程结束\",\n    parameters: {}\n  });\n\n  return nodes;\n\
          }\n\n/**\n * 生成节点连线\n */\nfunction generateConnections(data, nodes) {\n\
          \  const connections = [];\n  \n  // 添加开始节点到第一个用户节点的连线\n  if (nodes.length\
          \ > 2) { // 至少有开始、一个用户节点和结束节点\n    connections.push({\n      from: \"start_node\"\
          ,\n      to: \"node_1\",\n      type: \"开始连线\",\n      condition: \"流程启动\"\
          \n    });\n  }\n\n  // 生成顺序连线\n  for (let i = 1; i < nodes.length - 2; i++)\
          \ {\n    connections.push({\n      from: nodes[i].id,\n      to: nodes[i\
          \ + 1].id,\n      type: \"顺序连线\",\n      condition: \"默认下一步\"\n    });\n\
          \  }\n\n  // 添加最后一个用户节点到结束节点的连线\n  if (nodes.length > 2) {\n    connections.push({\n\
          \      from: nodes[nodes.length - 2].id,\n      to: \"end_node\",\n    \
          \  type: \"结束连线\",\n      condition: \"流程完成\"\n    });\n  }\n\n  // 处理条件分支\n\
          \  data.conditions.forEach(cond => {\n    // 查找条件节点\n    const conditionNode\
          \ = nodes.find(node => \n      node.type === \"条件节点\" || \n      node.description.includes(\"\
          判断\") || \n      node.description.includes(\"审核\")\n    );\n\n    // 查找目标节点\n\
          \    const targetNode = nodes.find(node => \n      node.description.includes(cond.action)\
          \ || \n      node.id === cond.action\n    );\n\n    if (conditionNode &&\
          \ targetNode) {\n      connections.push({\n        from: conditionNode.id,\n\
          \        to: targetNode.id,\n        type: \"条件连线\",\n        condition:\
          \ cond.condition\n      });\n    }\n  });\n\n  return connections;\n}\n\n\
          /**\n * 验证工作流结构\n */\nfunction validateWorkflow(nodes, connections) {\n\
          \  if (nodes.length < 3) { // 至少需要开始、一个用户节点和结束节点\n    throw new Error(\"\
          生成的工作流节点数量不足，请检查需求描述\");\n  }\n\n  const nodeIds = new Set(nodes.map(node\
          \ => node.id));\n  const invalidConnections = connections.filter(conn =>\
          \ \n    !nodeIds.has(conn.from) || !nodeIds.has(conn.to)\n  );\n\n  if (invalidConnections.length\
          \ > 0) {\n    throw new Error(\"存在无效的节点连线，请检查节点ID是否匹配\");\n  }\n}\n\nmodule.exports\
          \ = { main };"
