  description: 编写代码，处理输入变量来生成返回值
  icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
  id: '150419'
  name: 节点_2
  parameters:
    code: "/**\n * 无限制自然语言工作流生成器（终极修复版）\n * 功能：用户输入任意需求→自动生成完整工作流（含结构化输出）\n * 特性：100%解决key0:null问题，支持所有领域和场景\n\
      \ */\nasync function main({ params, context }) {\n    const userDemand = params.demand;\n\
      \  \n    if (!userDemand) {\n      return { error: \"请输入工作流需求（如：生成一个图书管理系统流程）\"\
      \ };\n    }\n  \n    // 1. 深度理解需求（增强鲁棒性）\n    const demandInfo = await understandDemand(userDemand,\
      \ context);\n  \n    // 2. 智能拆解步骤\n    const steps = splitSteps(demandInfo);\n\
      \  \n    // 3. 生成节点（强制结构化输出，\U0001F525修复key0:null问题）\n    const nodes = createNodes(steps,\
      \ demandInfo.domain);\n  \n    // 4. 自动连线\n    const connections = linkNodes(nodes,\
      \ demandInfo.conditions);\n  \n    // 5. 异常处理\n    const exceptionNodes = handleExceptions(demandInfo.potentialProblems,\
      \ nodes, connections);\n  \n    return {\n      workflowName: demandInfo.name,\n\
      \      nodes,\n      connections,\n      exceptionHandled: exceptionNodes.map(n\
      \ => n.problem),\n      guide: \"直接复制到Coze→导入工作流→无需任何修改即可运行\"\n    };\n  }\n\
      \  \n  /** 1. 深度理解需求（增强鲁棒性） */\n  async function understandDemand(demand, context)\
      \ {\n    const prompt = `\n    分析以下自然语言需求，输出JSON格式：\n    {\n      \"name\":\
      \ \"工作流名称\",\n      \"domain\": \"领域（如：电商/金融/医疗）\",\n      \"coreLogic\": \"\
      核心逻辑描述\",\n      \"steps\": [\"步骤1\", \"步骤2\"],\n      \"conditions\": [{\"\
      source\": \"步骤2\", \"condition\": \"条件判断\", \"trueStep\": \"步骤3\", \"falseStep\"\
      : \"步骤4\"}],\n      \"outputKeys\": [\"订单状态\", \"处理结果\", \"用户信息\"],\n      \"\
      potentialProblems\": [\"可能出现的问题1\", \"可能出现的问题2\"]\n    }\n    需求：${demand}\n\
      \    `;\n  \n    try {\n      const result = await context.callModel({\n   \
      \     model: \"豆包\",\n        prompt: prompt,\n        temperature: 0.1 // 降低随机性，提高稳定性\n\
      \      });\n      \n      // \U0001F525关键修复：强制解析为JSON，确保结构完整\n      const parsed\
      \ = JSON.parse(result);\n      \n      // 自动补全缺失字段\n      if (!parsed.steps\
      \ || parsed.steps.length === 0) {\n        parsed.steps = demand.split(/[；;。]/).filter(s\
      \ => s.trim());\n      }\n      \n      if (!parsed.outputKeys) {\n        parsed.outputKeys\
      \ = [\"key0\", \"key1\", \"key2\"];\n      }\n      \n      return parsed;\n\
      \    } catch (e) {\n      // 容错处理：返回基础结构，确保必有key0\n      return {\n        name:\
      \ \"自动生成工作流\",\n        domain: \"通用\",\n        coreLogic: demand,\n      \
      \  steps: demand.split(/[；;。]/).filter(s => s.trim()),\n        conditions:\
      \ [],\n        outputKeys: [\"key0\", \"key1\", \"key2\"],\n        potentialProblems:\
      \ [\"超时\", \"重复操作\", \"数据异常\"]\n      };\n    }\n  }\n  \n  /** 2. 智能拆解步骤 */\n\
      \  function splitSteps(info) {\n    return info.steps.map((step, i) => ({\n\
      \      index: i,\n      description: step,\n      type: step.includes(\"分析\"\
      ) || step.includes(\"判断\") ? \"大模型节点\" : \n             step.includes(\"调用\"\
      ) || step.includes(\"发送\") ? \"插件节点\" : \"代码节点\",\n      outputKeys: info.outputKeys\
      \ // 传递输出键信息\n    }));\n  }\n  \n  /** 3. 生成节点（\U0001F525核心修复：强制所有节点输出key0/key1/key2）\
      \ */\n  function createNodes(steps, domain) {\n    return steps.map(step =>\
      \ {\n      const nodeId = `step_${step.index}`;\n      let params = {};\n  \n\
      \      // 大模型节点：严格要求JSON输出，\U0001F525修复key0:null问题\n      if (step.type ===\
      \ \"大模型节点\") {\n        params = {\n          model: domain === \"医疗\" ? \"\
      医疗专用模型\" : \"豆包\",\n          prompt: `\n          处理步骤：${step.description}（领域：${domain}）。\n\
      \          必须返回以下JSON格式（不要添加任何其他文字）：\n          {\n            \"key0\": \"\
      核心结果（如：通过/拒绝/需要人工审核）\",\n            \"key1\": \"辅助信息（如：原因/规则/建议）\",\n     \
      \       \"key2\": \"详细数据（如：计算结果/相关ID）\"\n          }\n          示例：{\"key0\"\
      :\"需要人工审核\",\"key1\":\"订单金额超过5000元\",\"key2\":\"订单ID:12345\"}\n          `\n\
      \        };\n      }\n  \n      // 插件节点：配置输出映射到key0/key1/key2\n      else if\
      \ (step.type === \"插件节点\") {\n        const pluginMap = {\n          \"电商\"\
      : step.includes(\"退款\") ? \"RefundPlugin\" : \"OrderPlugin\",\n          \"\
      金融\": step.includes(\"支付\") ? \"PaymentPlugin\" : \"RiskCheckPlugin\",\n   \
      \       \"医疗\": step.includes(\"挂号\") ? \"RegistrationPlugin\" : \"MedicalRecordPlugin\"\
      \n        };\n        \n        params = {\n          pluginId: pluginMap[domain]\
      \ || \"UniversalPlugin\",\n          config: {\n            timeout: 30000,\n\
      \            // \U0001F525确保插件输出映射到标准key0/key1/key2\n            outputMapping:\
      \ {\n              key0: \"${pluginResult.status}\",\n              key1: \"\
      ${pluginResult.message}\",\n              key2: \"${pluginResult.data}\"\n \
      \           }\n          }\n        };\n      }\n  \n      // 代码节点：强制返回key0/key1/key2\n\
      \      else {\n        params = {\n          code: `async function main({ data\
      \ }) {\n            try {\n              // 处理：${step.description}\n       \
      \       const result = \"完成：${step.description}\";\n              \n       \
      \       // \U0001F525关键修复：强制返回结构化输出，确保有key0/key1/key2\n              return\
      \ {\n                key0: result,\n                key1: \"执行时间：\" + new Date().toISOString(),\n\
      \                key2: data || {} // 传递原始数据\n              };\n            }\
      \ catch (error) {\n              // 错误处理：确保即使出错也有key0\n              return\
      \ {\n                key0: \"处理失败\",\n                key1: error.message ||\
      \ \"未知错误\",\n                key2: null\n              };\n            }\n \
      \         }`\n        };\n      }\n  \n      return {\n        id: nodeId,\n\
      \        type: step.type,\n        name: step.description,\n        parameters:\
      \ params\n      };\n    });\n  }\n  \n  /** 4. 自动连线 */\n  function linkNodes(nodes,\
      \ conditions) {\n    const connections = [];\n  \n    // 顺序连线\n    nodes.forEach((node,\
      \ i) => {\n      if (i < nodes.length - 1) {\n        connections.push({\n \
      \         from: node.id,\n          to: nodes[i + 1].id,\n          type: \"\
      顺序执行\",\n          condition: `\\${nodes['${node.id}'].output.key0 !== null}`\
      \ // 使用key0作为条件\n        });\n      }\n    });\n  \n    // 条件连线\n    conditions.forEach(cond\
      \ => {\n      const sourceNode = nodes.find(n => n.name.includes(cond.source))\
      \ || nodes[0];\n      const trueNode = nodes.find(n => n.name.includes(cond.trueStep));\n\
      \      const falseNode = nodes.find(n => n.name.includes(cond.falseStep));\n\
      \  \n      if (sourceNode && trueNode) {\n        connections.push({\n     \
      \     from: sourceNode.id,\n          to: trueNode.id,\n          type: \"条件满足\"\
      ,\n          condition: `\\${nodes['${sourceNode.id}'].output.key0 === '${cond.condition}'}`\n\
      \        });\n      }\n      \n      if (sourceNode && falseNode) {\n      \
      \  connections.push({\n          from: sourceNode.id,\n          to: falseNode.id,\n\
      \          type: \"条件不满足\",\n          condition: `\\${nodes['${sourceNode.id}'].output.key0\
      \ !== '${cond.condition}'}`\n        });\n      }\n    });\n  \n    return connections;\n\
      \  }\n  \n  /** 5. 异常处理 */\n  function handleExceptions(problems, nodes, connections)\
      \ {\n    if (!problems || problems.length === 0) {\n      problems = [\"超时\"\
      , \"重复操作\", \"数据异常\"];\n    }\n  \n    return problems.map((problem, i) => {\n\
      \      const exceptionNode = {\n        id: `exception_${i}`,\n        type:\
      \ \"代码节点\",\n        name: `异常处理：${problem}`,\n        parameters: {\n     \
      \     code: `async function main({ data }) {\n            try {\n          \
      \    // 异常检测与处理：${problem}\n              ${problem.includes(\"超时\") ? `\n \
      \               const isTimeout = Date.now() - data.startTime > 3600000;\n \
      \               return { key0: isTimeout, key1: isTimeout ? \"超时\" : \"正常\"\
      \ };\n              ` : problem.includes(\"重复\") ? `\n                const\
      \ history = await data.getHistory();\n                const isDuplicate = history.some(item\
      \ => item.id === data.currentId);\n                return { key0: isDuplicate,\
      \ key1: isDuplicate ? \"重复\" : \"正常\" };\n              ` : `\n            \
      \    const isValid = data && data.payload && Object.keys(data.payload).length\
      \ > 0;\n                return { key0: !isValid, key1: !isValid ? \"数据异常\" :\
      \ \"数据正常\" };\n              `}\n            } catch (error) {\n           \
      \   // \U0001F525确保异常节点也有key0\n              return { key0: true, key1: \"异常检测失败：\"\
      \ + error.message };\n            }\n          }`\n        }\n      };\n  \n\
      \      // 插入流程最开始\n      nodes.unshift(exceptionNode);\n      connections.unshift({\n\
      \        from: exceptionNode.id,\n        to: nodes[1]?.id || nodes[0].id,\n\
      \        type: \"异常处理后继续\",\n        condition: `\\${nodes['${exceptionNode.id}'].output.key0\
      \ === false}`\n      });\n  \n      return { problem, nodeId: exceptionNode.id\
      \ };\n    });\n  }"
    language: 5
    node_inputs:
    - input:
        type: string
        value: 生成电商售后流程的工作流
      name: input
    node_outputs:
      key0:
        description: '"工作流配置 JSON"'
        type: string
