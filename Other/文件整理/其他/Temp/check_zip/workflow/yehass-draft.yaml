          = parameters.model || "gpt-3.5-turbo";         break;       case "插件节点":         parameters.pluginName
          = parameters.pluginName ||            step.description.includes("表单") ?
          "FormSubmit" : "DataProcess";         break;       case "条件节点":         parameters.condition
          = parameters.condition || "条件判断";         break;       case "代码节点":         parameters.code
          = parameters.code ||            `// 实现 ${step.description}\nconsole.log("执行
          ${step.description}");\nreturn true;`;         break;     }      nodes.push({       id:
          nodeId,       type: step.type,       description: step.description,       parameters     });   });    //
          自动添加结束节点   nodes.push({     id: "end_node",     type: "结束节点",     description:
          "流程结束",     parameters: {}   });    return nodes; }  /**  * 生成节点连线  */ function
          generateConnections(data, nodes) {   const connections = [];      // 添加开始节点到第一个用户节点的连线   if
          (nodes.length > 2) { // 至少有开始、一个用户节点和结束节点     connections.push({       from:
          "start_node",       to: "node_1",       type: "开始连线",       condition: "流程启动"     });   }    //
          生成顺序连线   for (let i = 1; i < nodes.length - 2; i++) {     connections.push({       from:
          nodes[i].id,       to: nodes[i + 1].id,       type: "顺序连线",       condition:
          "默认下一步"     });   }    // 添加最后一个用户节点到结束节点的连线   if (nodes.length > 2) {     connections.push({       from:
          nodes[nodes.length - 2].id,       to: "end_node",       type: "结束连线",       condition:
          "流程完成"     });   }    // 处理条件分支   data.conditions.forEach(cond => {     //
          查找条件节点     const conditionNode = nodes.find(node =>        node.type ===
          "条件节点" ||        node.description.includes("判断") ||        node.description.includes("审核")     );      //
          查找目标节点     const targetNode = nodes.find(node =>        node.description.includes(cond.action)
          ||        node.id === cond.action     );      if (conditionNode && targetNode)
          {       connections.push({         from: conditionNode.id,         to: targetNode.id,         type:
          "条件连线",         condition: cond.condition       });     }   });    return
          connections; }  /**  * 验证工作流结构  */ function validateWorkflow(nodes, connections)
          {   if (nodes.length < 3) { // 至少需要开始、一个用户节点和结束节点     throw new Error("生成的工作流节点数量不足，请检查需求描述");   }    const
